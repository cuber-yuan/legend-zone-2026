{% extends 'components/auth_page.html' %}
{% set operation = 'register' %}
{% set heading = 'Register' %}

{% block auth_fields %}
    <div class="auth-field">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required minlength="4" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required minlength="8" maxlength="256" autocomplete="new-password">
    </div>
    <div class="auth-field">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" name="confirm_password" id="confirm_password" required minlength="8" maxlength="256" autocomplete="new-password">
    </div>
    <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required maxlength="254" autocomplete="email">
    </div>
{% endblock %}

{% block auth_switch %}Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>{% endblock %}

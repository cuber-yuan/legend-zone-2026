{% extends 'components/auth_page.html' %}
{% set operation = 'login' %}
{% set heading = 'Login' %}

{% block auth_fields %}
    <div class="auth-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required maxlength="40" autocapitalize="none" spellcheck="false">
    </div>
    <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="256">
    </div>
{% endblock %}

{% block auth_switch %}Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>{% endblock %}

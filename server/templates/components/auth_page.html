{% extends 'base.html' %}
{% block title %}{{ heading }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
<section class="auth-page" aria-labelledby="auth-title">
    <div class="auth-card">
        <header class="auth-header">
            <h1 id="auth-title">{{ heading }}</h1>
        </header>
        <div class="auth-body">
            <form id="{{ operation }}-form" method="post" action="{{ url_for('auth.' + operation) }}" class="auth-form" data-operation="{{ operation }}">
                {% block auth_fields %}{% endblock %}
                <p id="auth-feedback" class="auth-feedback" role="alert" tabindex="-1" hidden></p>
                <button type="submit" class="auth-submit">{{ heading }}</button>
            </form>
            <p class="auth-switch">{% block auth_switch %}{% endblock %}</p>
        </div>
    </div>
</section>
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}

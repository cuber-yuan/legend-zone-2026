<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Legend Zone</title>

  <!-- A crown for "Legend", grounded on an IC: three prongs terminating in nodes,
     three bonding pins under them. Solid shapes only — a hairline trace measures
     under 1px once this is drawn as a 16px favicon. -->

  <defs>
    <linearGradient id="lz-field" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="64" height="64" rx="16" fill="url(#lz-field)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>

  <!-- crown -->
  <path d="M16 40 L22 24 L27 31 L32 19 L37 31 L42 24 L48 40 Z" fill="#ffffff"/>
  <circle cx="22" cy="21" r="3" fill="#bae6fd"/>
  <circle cx="32" cy="16" r="3.5" fill="#bae6fd"/>
  <circle cx="42" cy="21" r="3" fill="#bae6fd"/>

  <!-- chip body, with the pin-1 dimple punched through to the field -->
  <rect x="16" y="43" width="32" height="5" rx="1.5" fill="#ffffff"/>
  <circle cx="21" cy="45.5" r="1.5" fill="url(#lz-field)"/>
  <!-- bonding pins, aligned to the three prongs above -->
  <rect x="18" y="48" width="8" height="5" fill="#ffffff"/>
  <rect x="28" y="48" width="8" height="5" fill="#ffffff"/>
  <rect x="38" y="48" width="8" height="5" fill="#ffffff"/>
</svg>
